name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python infrastructure/scripts/setup.py
      - run: python -m alembic upgrade head
      - run: python -m ruff check apps/api tests datasets infrastructure/scripts
      - run: python -m ruff format --check apps/api tests datasets infrastructure/scripts
      - run: python -m pytest -q
      - run: python -m pip_audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit
  services-and-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python infrastructure/scripts/setup.py
      - run: docker compose up -d --wait postgres mysql mongo qdrant search
      - run: python datasets/generate.py
      - run: python datasets/load_services.py
      - run: python -m pytest tests/integration -q
        env:
          RUN_SERVICE_TESTS: '1'
      - run: docker compose --profile app build api web
      - if: always()
        run: docker compose down
