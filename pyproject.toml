[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datamind-ai"
version = "0.1.0"
description = "Self-hosted, permission-aware conversational data intelligence"
requires-python = ">=3.12"
dependencies = [
  "certifi==2026.10.19",
  "fastapi==0.149.0", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.5",
  "alembic==1.20.0", "psycopg[binary]==3.3.6", "pymysql==1.2.3", "pymongo==4.19.0",
  "pydantic-settings==2.16.0", "email-validator==2.3.0", "argon2-cffi==25.1.0",
  "cryptography==50.0.2", "python-multipart==0.0.32", "sqlglot==30.23.0",
  "duckdb==1.5.6", "openpyxl==3.1.5", "pypdf==6.21.1", "python-docx==1.2.0",
  "qdrant-client==1.19.1", "fastembed==0.9.0", "google-genai==2.31.0",
  "mcp==2.3.0", "httpx==0.28.1", "psutil==7.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1", "pip-audit==2.10.1", "reportlab==5.0.1"]
research = ["sentence-transformers>=5,<6", "docling>=2,<3"]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
markers = ["services: requires real database and Qdrant services", "models: downloads and executes real HF models", "live: requires explicitly enabled Gemini calls"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
